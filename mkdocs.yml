site_name: A Smart Bear — Unofficial Field Notes
site_url: https://kevindrafts.github.io/asmartbear-wiki/
site_description: Independent, source-linked notes on Jason Cohen's company-building essays.
repo_url: https://github.com/kevindrafts/asmartbear-wiki
edit_uri: ''
docs_dir: site/docs
site_dir: site/public
theme:
  name: mkdocs
  color_mode: auto
  nav_style: dark
  navigation_depth: 2
plugins:
  - search
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
extra_css:
  - assets/wiki.css
copyright: Unofficial; not endorsed by Jason Cohen. Original editorial content CC BY 4.0; third-party works excluded.
nav:
  - Start here: index.md
  - Topics: wiki/topics/index.md
  - Decision guides: wiki/guides/index.md
  - Reading paths: wiki/reading-paths/index.md
  - Article catalog: processed/index.md
  - Coverage: reports/coverage.md
  - Attribution: ATTRIBUTION.md
  - Editorial license: CONTENT-LICENSE.md
extra_javascript:
  - assets/wiki.js
